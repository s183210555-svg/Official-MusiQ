<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Premium Timer Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #667eea;
    --secondary: #764ba2;
    --accent: #f093fb;
    --bg1: #1a1a3e;
    --bg2: #2d1b4e;
  }
  
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Rajdhani', sans-serif;
    background: radial-gradient(ellipse at top, var(--bg2), var(--bg1));
    overflow: hidden;
    position: relative;
    transition: background 0.8s ease;
  }
  
  #bgVideo {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 0;
    display: none;
  }
  
  #bgImage {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 0;
    display: none;
  }
  
  #particles {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
  }
  
  .settings-toggle, .playlist-toggle {
    position: fixed;
    padding: 10px 20px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 25px;
    color: #fff;
    cursor: pointer;
    backdrop-filter: blur(10px);
    font-family: 'Rajdhani', sans-serif;
    font-size: 1rem;
    font-weight: 600;
    letter-spacing: 1.5px;
    transition: all 0.3s ease;
    z-index: 100;
  }
  
  .settings-toggle { top: 20px; right: 20px; }
  .playlist-toggle { top: 20px; right: 200px; }
  
  .settings-toggle:hover, .playlist-toggle:hover {
    background: rgba(255, 255, 255, 0.15);
    transform: translateY(-2px);
  }
  
  .settings-panel {
    position: fixed;
    top: 0;
    right: -450px;
    width: 420px;
    height: 100vh;
    background: rgba(10, 14, 39, 0.97);
    backdrop-filter: blur(30px);
    border-left: 1px solid rgba(255, 255, 255, 0.1);
    z-index: 99;
    padding: 80px 30px 30px;
    overflow-y: auto;
    transition: right 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: -20px 0 60px rgba(0, 0, 0, 0.5);
  }
  
  .settings-panel.open { right: 0; }
  
  .settings-panel::-webkit-scrollbar, .modal-playlist::-webkit-scrollbar { width: 6px; }
  .settings-panel::-webkit-scrollbar-track, .modal-playlist::-webkit-scrollbar-track { background: transparent; }
  .settings-panel::-webkit-scrollbar-thumb, .modal-playlist::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.2);
    border-radius: 3px;
  }
  
  .settings-section { margin-bottom: 30px; }
  
  .settings-title {
    color: #fff;
    font-family: 'Rajdhani', sans-serif;
    font-size: 1rem;
    font-weight: 600;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    margin-bottom: 15px;
    opacity: 0.8;
  }
  
  .interval-inputs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
  }
  
  .input-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  
  .input-group label {
    color: rgba(255, 255, 255, 0.6);
    font-family: 'Rajdhani', sans-serif;
    font-size: 0.95rem;
    font-weight: 500;
    letter-spacing: 1.5px;
  }
  
  .input-group input {
    padding: 12px 15px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 12px;
    color: #fff;
    font-family: 'Rajdhani', sans-serif;
    font-size: 1.2rem;
    font-weight: 600;
    text-align: center;
    outline: none;
    transition: all 0.3s ease;
  }
  
  .input-group input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
  }
  
  .melody-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  
  .melody-btn {
    padding: 10px 12px;
    font-family: 'Rajdhani', sans-serif;
    font-size: 0.9rem;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.7);
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.3s ease;
  }
  
  .melody-btn:hover {
    background: rgba(255, 255, 255, 0.1);
    color: #fff;
    transform: translateY(-2px);
  }
  
  .melody-btn.active {
    background: linear-gradient(135deg, rgba(0, 212, 255, 0.2), rgba(123, 47, 247, 0.2));
    border-color: var(--primary);
    color: #fff;
    box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
  }
  
  .theme-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  
  .theme-btn {
    aspect-ratio: 1;
    border-radius: 12px;
    cursor: pointer;
    border: 2px solid transparent;
    transition: all 0.3s ease;
  }
  
  .theme-btn:hover {
    transform: scale(1.1);
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
  }
  
  .theme-btn.active {
    border-color: #fff;
    box-shadow: 0 0 25px rgba(255, 255, 255, 0.5);
  }
  
  .theme-cosmic { background: linear-gradient(135deg, #667eea, #764ba2); }
  .theme-blue { background: linear-gradient(135deg, #00d4ff, #0066ff); }
  .theme-red { background: linear-gradient(135deg, #ff416c, #ff4b2b); }
  .theme-green { background: linear-gradient(135deg, #11998e, #38ef7d); }
  .theme-yellow { background: linear-gradient(135deg, #f7971e, #ffd200); }
  .theme-orange { background: linear-gradient(135deg, #ff6b35, #f7931e); }
  .theme-pink { background: linear-gradient(135deg, #ff6b9d, #c44569); }
  .theme-cyber { background: linear-gradient(135deg, #00ff87, #60efff); }
  .theme-purple { background: linear-gradient(135deg, #a855f7, #6366f1); }
  .theme-teal { background: linear-gradient(135deg, #14b8a6, #06b6d4); }
  .theme-lime { background: linear-gradient(135deg, #84cc16, #22c55e); }
  .theme-coral { background: linear-gradient(135deg, #fb7185, #f43f5e); }
  .theme-indigo { background: linear-gradient(135deg, #4f46e5, #7c3aed); }
  .theme-amber { background: linear-gradient(135deg, #f59e0b, #ef4444); }
  .theme-slate { background: linear-gradient(135deg, #64748b, #334155); }
  .theme-rose { background: linear-gradient(135deg, #f43f5e, #e11d48); }
  
  .checkbox-group {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 15px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.3s ease;
  }
  
  .checkbox-group:hover { background: rgba(255, 255, 255, 0.1); }
  
  .checkbox-group input[type="checkbox"] {
    width: 20px;
    height: 20px;
    accent-color: var(--primary);
    cursor: pointer;
  }
  
  .checkbox-group label {
    color: rgba(255, 255, 255, 0.8);
    font-family: 'Rajdhani', sans-serif;
    font-size: 1rem;
    font-weight: 500;
    cursor: pointer;
    letter-spacing: 0.5px;
  }
  
  .file-input-wrapper {
    position: relative;
    overflow: hidden;
    display: inline-block;
    width: 100%;
  }
  
  .file-input-wrapper input[type="file"] {
    position: absolute;
    left: 0;
    top: 0;
    opacity: 0;
    width: 100%;
    height: 100%;
    cursor: pointer;
  }
  
  .file-input-label {
    display: block;
    padding: 14px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px dashed rgba(255, 255, 255, 0.3);
    border-radius: 12px;
    color: rgba(255, 255, 255, 0.7);
    text-align: center;
    font-family: 'Rajdhani', sans-serif;
    font-size: 1rem;
    font-weight: 500;
    letter-spacing: 1px;
    transition: all 0.3s ease;
    cursor: pointer;
  }
  
  .file-input-label:hover {
    background: rgba(255, 255, 255, 0.1);
    border-color: var(--primary);
    color: #fff;
  }
  
  .volume-slider {
    width: 100%;
    -webkit-appearance: none;
    height: 6px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 3px;
    outline: none;
    margin-top: 10px;
  }
  
  .volume-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px;
    height: 18px;
    background: var(--primary);
    border-radius: 50%;
    cursor: pointer;
    box-shadow: 0 0 15px var(--primary);
  }
  
  /* ====== МОДАЛЬНОЕ ОКНО ПЛЕЙЛИСТА ====== */
  .modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.8);
    backdrop-filter: blur(8px);
    z-index: 200;
    display: none;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  
  .modal-overlay.visible {
    display: flex;
    opacity: 1;
  }
  
  .modal-playlist {
    background: linear-gradient(135deg, #1a1f3a 0%, #0f1429 100%);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 20px;
    padding: 30px;
    width: 90%;
    max-width: 550px;
    max-height: 75vh;
    box-shadow: 0 40px 100px rgba(0, 0, 0, 0.7);
    transform: scale(0.9);
    transition: transform 0.3s ease;
  }
  
  .modal-overlay.visible .modal-playlist {
    transform: scale(1);
  }
  
  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
  }
  
  .modal-title {
    color: #fff;
    font-family: 'Rajdhani', sans-serif;
    font-size: 1.8rem;
    font-weight: 700;
    letter-spacing: 2px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  
  .modal-close {
    width: 40px;
    height: 40px;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 50%;
    color: #fff;
    font-size: 1.8rem;
    cursor: pointer;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  
  .modal-close:hover {
    background: rgba(255, 60, 60, 0.3);
    border-color: rgba(255, 60, 60, 0.5);
    transform: rotate(90deg);
  }
  
  .playlist {
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-height: 350px;
    overflow-y: auto;
    padding-right: 5px;
    margin-bottom: 15px;
  }
  
  .playlist-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px;
    transition: all 0.3s ease;
  }
  
  .playlist-item:hover {
    background: rgba(255, 255, 255, 0.08);
    transform: translateX(5px);
  }
  
  .playlist-item.active {
    border-color: var(--primary);
    background: rgba(102, 126, 234, 0.15);
    box-shadow: 0 0 20px rgba(102, 126, 234, 0.2);
  }
  
  .playlist-item-name {
    flex: 1;
    color: rgba(255, 255, 255, 0.9);
    font-family: 'Rajdhani', sans-serif;
    font-size: 1.05rem;
    font-weight: 500;
    letter-spacing: 0.5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  
  .playlist-item-btn {
    padding: 8px 14px;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 8px;
    color: #fff;
    cursor: pointer;
    font-family: 'Rajdhani', sans-serif;
    font-size: 0.9rem;
    font-weight: 600;
    transition: all 0.2s ease;
    min-width: 40px;
  }
  
  .playlist-item-btn:hover {
    background: rgba(255, 255, 255, 0.2);
  }
  
  .playlist-item-btn.delete:hover {
    background: rgba(255, 60, 60, 0.3);
    border-color: rgba(255, 60, 60, 0.5);
  }
  
  .playlist-item-btn.playing {
    background: var(--primary);
    border-color: var(--primary);
  }
  
  .bg-preview {
    margin-top: 10px;
    width: 100%;
    height: 120px;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid rgba(255, 255, 255, 0.1);
    display: none;
  }
  
  .bg-preview img, .bg-preview video {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  
  .bg-preview.visible { display: block; }
  
  .bg-controls {
    display: flex;
    gap: 10px;
    margin-top: 10px;
  }
  
  .bg-controls .file-input-wrapper {
    flex: 1;
  }
  
  .remove-bg-btn {
    padding: 14px 20px;
    background: rgba(255, 60, 60, 0.15);
    border: 1px solid rgba(255, 60, 60, 0.3);
    border-radius: 12px;
    color: #ff6b6b;
    font-family: 'Rajdhani', sans-serif;
    font-size: 1rem;
    font-weight: 600;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.3s ease;
    white-space: nowrap;
  }
  
  .remove-bg-btn:hover {
    background: rgba(255, 60, 60, 0.3);
    border-color: rgba(255, 60, 60, 0.5);
    color: #fff;
  }
  
  .container {
    position: relative;
    z-index: 10;
    text-align: center;
    padding: 60px 80px;
    background: rgba(255, 255, 255, 0.03);
    backdrop-filter: blur(25px);
    border-radius: 40px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
    transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
  }
  
  .mode {
    font-family: 'Rajdhani', sans-serif;
    font-size: 1.5rem;
    font-weight: 600;
    color: rgba(255, 255, 255, 0.8);
    letter-spacing: 6px;
    text-transform: uppercase;
    margin-bottom: 25px;
    transition: all 0.5s ease;
  }
  
  .timer {
    font-family: 'Rajdhani', sans-serif;
    font-size: 10rem;
    font-weight: 700;
    color: #fff;
    letter-spacing: 8px;
    font-variant-numeric: tabular-nums;
    transition: all 0.5s ease;
  }
  
  .work .timer {
    background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 0 40px var(--primary));
  }
  
  .rest .timer {
    background: linear-gradient(135deg, var(--accent) 0%, var(--primary) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 0 40px var(--accent));
  }
  
  .progress {
    width: 100%;
    height: 8px;
    background: rgba(255, 255, 255, 0.05);
    border-radius: 10px;
    margin: 35px 0;
    overflow: hidden;
  }
  
  .progress-bar {
    height: 100%;
    width: 0%;
    border-radius: 10px;
    transition: width 1s linear;
    position: relative;
    overflow: hidden;
    background: linear-gradient(90deg, var(--primary), var(--secondary));
    box-shadow: 0 0 20px var(--primary);
  }
  
  .progress-bar::after {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
    animation: shimmer 2s infinite;
  }
  
  @keyframes shimmer {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
  }
  
  .controls {
    display: flex;
    gap: 15px;
    justify-content: center;
    margin-top: 25px;
  }
  
  button.ctrl-btn {
    padding: 14px 40px;
    font-family: 'Rajdhani', sans-serif;
    font-size: 1.1rem;
    font-weight: 600;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: #fff;
    background: rgba(255, 255, 255, 0.05);
    border: 2px solid rgba(255, 255, 255, 0.2);
    border-radius: 50px;
    cursor: pointer;
    transition: all 0.3s ease;
    backdrop-filter: blur(10px);
  }
  
  button.ctrl-btn:hover {
    background: rgba(255, 255, 255, 0.15);
    transform: translateY(-3px);
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
    border-color: var(--primary);
  }
  
  .next-btn {
    display: none;
    padding: 14px 40px;
    font-family: 'Rajdhani', sans-serif;
    font-size: 1.1rem;
    font-weight: 600;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: #fff;
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    border: none;
    border-radius: 50px;
    cursor: pointer;
    margin-top: 20px;
    animation: pulseBtn 1.5s ease-in-out infinite;
    box-shadow: 0 0 30px var(--primary);
  }
  
  .next-btn.visible { display: inline-block; }
  
  @keyframes pulseBtn {
    0%, 100% { transform: scale(1); box-shadow: 0 0 30px var(--primary); }
    50% { transform: scale(1.05); box-shadow: 0 0 50px var(--primary); }
  }
  
  .cycle {
    margin-top: 30px;
    color: rgba(255, 255, 255, 0.5);
    font-family: 'Rajdhani', sans-serif;
    font-size: 1rem;
    font-weight: 500;
    letter-spacing: 2.5px;
  }
  
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }
  
  .pulse { animation: pulse 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
  
  @keyframes glow {
    0%, 100% { box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5), 0 0 30px var(--primary); }
    50% { box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5), 0 0 60px var(--primary); }
  }
  
  .work { animation: glow 3s ease-in-out infinite; }
  
  @keyframes glowRest {
    0%, 100% { box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5), 0 0 30px var(--accent); }
    50% { box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5), 0 0 60px var(--accent); }
  }
  
  .rest { animation: glowRest 3s ease-in-out infinite; }
  
  @media (max-width: 768px) {
    .container { padding: 40px 30px; }
    .timer { font-size: 5rem; }
    .settings-panel { width: 100%; right: -100%; }
    .playlist-toggle { right: 160px; }
  }
</style>
</head>
<body>

<video id="bgVideo" autoplay muted loop playsinline></video>
<img id="bgImage" alt="">
<canvas id="particles"></canvas>

<button class="settings-toggle" id="settingsToggle"> Настройки</button>
<button class="playlist-toggle" id="playlistToggle">🎵 Плейлист</button>

<!-- МОДАЛЬНОЕ ОКНО ПЛЕЙЛИСТА -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-playlist">
    <div class="modal-header">
      <div class="modal-title">🎵 Мой плейлист</div>
      <button class="modal-close" id="modalClose">×</button>
    </div>
    <div class="file-input-wrapper" style="margin-bottom: 15px;">
      <input type="file" id="modalMusicInput" accept="audio/*" multiple>
      <div class="file-input-label">🎵 Добавить треки (можно несколько)</div>
    </div>
    <div class="playlist" id="modalPlaylist"></div>
    <input type="range" class="volume-slider" id="modalVolumeSlider" min="0" max="100" value="50">
  </div>
</div>

<div class="settings-panel" id="settingsPanel">
  <div class="settings-section">
    <div class="settings-title">Интервалы (секунды)</div>
    <div class="interval-inputs">
      <div class="input-group">
        <label>Работа</label>
        <input type="number" id="workInterval" value="60" min="5" max="3600">
      </div>
      <div class="input-group">
        <label>Отдых</label>
        <input type="number" id="restInterval" value="30" min="5" max="3600">
      </div>
    </div>
  </div>
  
  <div class="settings-section">
    <div class="settings-title">Мелодия звонка</div>
    <div class="melody-grid" id="melodyGrid"></div>
  </div>
  
  <div class="settings-section">
    <div class="settings-title">Тема оформления</div>
    <div class="theme-grid" id="themeGrid"></div>
  </div>
  
  <div class="settings-section">
    <div class="settings-title">Режим</div>
    <div class="checkbox-group">
      <input type="checkbox" id="manualMode">
      <label for="manualMode">Ручной переход (кнопка «Далее»)</label>
    </div>
  </div>
  
  <div class="settings-section">
    <div class="settings-title">Фоновая музыка</div>
    <div style="color:rgba(255,255,255,0.5);font-family:'Rajdhani';font-size:0.95rem;margin-bottom:10px;">
      Откройте плейлист для управления музыкой →
    </div>
    <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="50">
  </div>
  
  <div class="settings-section">
    <div class="settings-title">Фон (фото или видео)</div>
    <div class="bg-controls">
      <div class="file-input-wrapper">
        <input type="file" id="bgInput" accept="image/*,video/*">
        <div class="file-input-label">📁 Установить фон</div>
      </div>
      <button class="remove-bg-btn" id="removeBgBtn"> Убрать</button>

</div>

<div class="container work" id="container">
  <div class="mode" id="mode">Работа</div>
  <div class="timer" id="timer">01:00</div>
  <div class="progress"><div class="progress-bar" id="progress"></div></div>
  
  <div class="controls">
    <button class="ctrl-btn" id="startBtn">Старт</button>
    <button class="ctrl-btn" id="resetBtn">Сброс</button>
  </div>
  <button class="next-btn" id="nextBtn">Далее ▶</button>
  <div class="cycle" id="cycle">Цикл: 1</div>
</div>

<audio id="bgAudio"></audio>

<script>
// ====== ПРОСТОЕ ХРАНИЛИЩЕ (localStorage для надежности) ======
const Storage = {
  getPlaylist() {
    try {
      const data = localStorage.getItem('timer_playlist');
      return data ? JSON.parse(data) : [];
    } catch(e) {
      console.error('Error loading playlist:', e);
      return [];
    }
  },
  
  savePlaylist(playlist) {
    try {
      localStorage.setItem('timer_playlist', JSON.stringify(playlist));
    } catch(e) {
      console.error('Error saving playlist:', e);
      alert('Не удалось сохранить плейлист. Возможно, файлы слишком большие.');
    }
  },
  
  getBgMedia() {
    try {
      const data = localStorage.getItem('timer_bgMedia');
      return data ? JSON.parse(data) : null;
    } catch(e) {
      return null;
    }
  },
  
  saveBgMedia(type, dataUrl) {
    try {
      localStorage.setItem('timer_bgMedia', JSON.stringify({ type, data: dataUrl }));
    } catch(e) {
      console.error('Error saving bg:', e);
      alert('Не удалось сохранить фон. Файл слишком большой.');
    }
  },
  
  deleteBgMedia() {
    try {
      localStorage.removeItem('timer_bgMedia');
    } catch(e) {
      console.error('Error deleting bg:', e);
    }
  }
};

// ====== ТЕМЫ ======
const themes = {
  cosmic: { primary: '#667eea', secondary: '#764ba2', accent: '#f093fb', bg1: '#1a1a3e', bg2: '#2d1b4e' },
  blue:   { primary: '#00d4ff', secondary: '#0066ff', accent: '#4fc3f7', bg1: '#0a1929', bg2: '#0d2847' },
  red:    { primary: '#ff416c', secondary: '#ff4b2b', accent: '#ff8a80', bg1: '#2a0a0a', bg2: '#4a1010' },
  green:  { primary: '#11998e', secondary: '#38ef7d', accent: '#69f0ae', bg1: '#0a2a1f', bg2: '#0d3d2a' },
  yellow: { primary: '#f7971e', secondary: '#ffd200', accent: '#fff176', bg1: '#2a2000', bg2: '#4a3800' },
  orange: { primary: '#ff6b35', secondary: '#f7931e', accent: '#ffab40', bg1: '#2a1500', bg2: '#4a2500' },
  pink:   { primary: '#ff6b9d', secondary: '#c44569', accent: '#ff80ab', bg1: '#2a0a1a', bg2: '#4a1030' },
  cyber:  { primary: '#00ff87', secondary: '#60efff', accent: '#00e5ff', bg1: '#001a1a', bg2: '#002a2a' },
  purple: { primary: '#a855f7', secondary: '#6366f1', accent: '#c084fc', bg1: '#1a0a2e', bg2: '#2d1050' },
  teal:   { primary: '#14b8a6', secondary: '#06b6d4', accent: '#5eead4', bg1: '#0a1f1f', bg2: '#0d3030' },
  lime:   { primary: '#84cc16', secondary: '#22c55e', accent: '#a3e635', bg1: '#0f1f0a', bg2: '#1a3510' },
  coral:  { primary: '#fb7185', secondary: '#f43f5e', accent: '#fda4af', bg1: '#2a0a10', bg2: '#4a1020' },
  indigo: { primary: '#4f46e5', secondary: '#7c3aed', accent: '#818cf8', bg1: '#0f0a2a', bg2: '#1a1050' },
  amber:  { primary: '#f59e0b', secondary: '#ef4444', accent: '#fbbf24', bg1: '#2a1a00', bg2: '#4a2a00' },
  slate:  { primary: '#94a3b8', secondary: '#64748b', accent: '#cbd5e1', bg1: '#0f1419', bg2: '#1e293b' },
  rose:   { primary: '#f43f5e', secondary: '#e11d48', accent: '#fb7185', bg1: '#2a0510', bg2: '#4a0a1a' }
};

let currentTheme = 'cosmic';

function applyTheme(name) {
  const t = themes[name];
  const root = document.documentElement;
  root.style.setProperty('--primary', t.primary);
  root.style.setProperty('--secondary', t.secondary);
  root.style.setProperty('--accent', t.accent);
  root.style.setProperty('--bg1', t.bg1);
  root.style.setProperty('--bg2', t.bg2);
  currentTheme = name;
  document.querySelectorAll('.theme-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.theme === name);
  });
  localStorage.setItem('timer_theme', name);
}

// ====== МЕЛОДИИ ======
const melodies = [
  { name: '🔔 Колокол', type: 'sine', notes: [440, 554.37, 659.25, 880], duration: 0.6 },
  { name: '🎹 Пианино', type: 'triangle', notes: [261.63, 329.63, 392, 523.25], duration: 0.5 },
  { name: ' Синтез', type: 'sine', notes: [220, 277.18, 329.63, 440], duration: 0.45 },
  { name: '🎺 Фанфары', type: 'triangle', notes: [196, 261.63, 329.63, 392, 523.25], duration: 0.4 },
  { name: '🎻 Орган', type: 'sine', notes: [130.81, 164.81, 196, 261.63], duration: 0.7 },
  { name: '🎼 Арпеджио', type: 'triangle', notes: [196, 246.94, 293.66, 392, 493.88], duration: 0.35 },
  { name: ' Волна', type: 'sine', notes: [220, 261.63, 329.63, 261.63, 220], duration: 0.5 },
  { name: '✨ Звёзды', type: 'sine', notes: [523.25, 659.25, 783.99, 659.25, 523.25], duration: 0.4 },
  { name: '🌙 Луна', type: 'triangle', notes: [174.61, 220, 261.63, 349.23], duration: 0.55 },
  { name: '☀️ Солнце', type: 'sine', notes: [261.63, 329.63, 392, 523.25, 659.25], duration: 0.45 }
];

let currentMelody = 0;

const audioContext = new (window.AudioContext || window.webkitAudioContext)();

function playMelody(melodyIndex) {
  const m = melodies[melodyIndex];
  const now = audioContext.currentTime;
  
  m.notes.forEach((freq, i) => {
    const startTime = now + i * 0.2;
    
    const osc1 = audioContext.createOscillator();
    const gain1 = audioContext.createGain();
    osc1.connect(gain1);
    gain1.connect(audioContext.destination);
    osc1.frequency.value = freq;
    osc1.type = m.type;
    
    const osc2 = audioContext.createOscillator();
    const gain2 = audioContext.createGain();
    osc2.connect(gain2);
    gain2.connect(audioContext.destination);
    osc2.frequency.value = freq * 1.5;
    osc2.type = 'sine';
    
    gain1.gain.setValueAtTime(0, startTime);
    gain1.gain.linearRampToValueAtTime(0.35, startTime + 0.05);
    gain1.gain.linearRampToValueAtTime(0.14, startTime + 0.15);
    gain1.gain.exponentialRampToValueAtTime(0.001, startTime + m.duration);
    
    gain2.gain.setValueAtTime(0, startTime);
    gain2.gain.linearRampToValueAtTime(0.1, startTime + 0.05);
    gain2.gain.exponentialRampToValueAtTime(0.001, startTime + m.duration);
    
    osc1.start(startTime);
    osc1.stop(startTime + m.duration + 0.1);
    osc2.start(startTime);
    osc2.stop(startTime + m.duration + 0.1);
  });
}

// ====== ЧАСТИЦЫ ======
const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

window.addEventListener('resize', () => {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});

class Particle {
  constructor() { this.reset(); }
  reset() {
    this.x = Math.random() * canvas.width;
    this.y = Math.random() * canvas.height;
    this.size = Math.random() * 2 + 0.5;
    this.speedX = (Math.random() - 0.5) * 0.5;
    this.speedY = (Math.random() - 0.5) * 0.5;
    this.opacity = Math.random() * 0.5 + 0.2;
  }
  update() {
    this.x += this.speedX;
    this.y += this.speedY;
    if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
    if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
  }
  draw() {
    ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
  }
}

const particles = Array.from({ length: 120 }, () => new Particle());

function animateParticles() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  particles.forEach(p => { p.update(); p.draw(); });
  requestAnimationFrame(animateParticles);
}
animateParticles();

// ====== ТАЙМЕР ======
let intervals = [60, 30];
const labels = ['Работа', 'Отдых'];
let currentIndex = 0;
let timeLeft = intervals[0];
let totalTime = intervals[0];
let timerId = null;
let isRunning = false;
let cycle = 1;
let manualMode = false;
let waitingForNext = false;
let ringIntervalId = null;

const timerEl = document.getElementById('timer');
const modeEl = document.getElementById('mode');
const progressEl = document.getElementById('progress');
const container = document.getElementById('container');
const cycleEl = document.getElementById('cycle');
const startBtn = document.getElementById('startBtn');
const resetBtn = document.getElementById('resetBtn');
const nextBtn = document.getElementById('nextBtn');
const workInput = document.getElementById('workInterval');
const restInput = document.getElementById('restInterval');
const manualCheckbox = document.getElementById('manualMode');
const settingsToggle = document.getElementById('settingsToggle');
const settingsPanel = document.getElementById('settingsPanel');
const playlistToggle = document.getElementById('playlistToggle');
const bgAudio = document.getElementById('bgAudio');
const volumeSlider = document.getElementById('volumeSlider');
const modalVolumeSlider = document.getElementById('modalVolumeSlider');
const modalOverlay = document.getElementById('modalOverlay');
const modalClose = document.getElementById('modalClose');
const modalPlaylist = document.getElementById('modalPlaylist');
const modalMusicInput = document.getElementById('modalMusicInput');
const bgInput = document.getElementById('bgInput');
const removeBgBtn = document.getElementById('removeBgBtn');
const bgVideo = document.getElementById('bgVideo');
const bgImage = document.getElementById('bgImage');
const bgPreview = document.getElementById('bgPreview');

function formatTime(sec) {
  const m = String(Math.floor(sec / 60)).padStart(2, '0');
  const s = String(sec % 60).padStart(2, '0');
  return `${m}:${s}`;
}

function updateDisplay() {
  timerEl.textContent = formatTime(timeLeft);
  const percent = ((totalTime - timeLeft) / totalTime) * 100;
  progressEl.style.width = percent + '%';
  document.title = `${formatTime(timeLeft)} — ${labels[currentIndex]}`;
}

function startRinging() {
  playMelody(currentMelody);
  if (manualMode) {
    ringIntervalId = setInterval(() => playMelody(currentMelody), 2500);
    nextBtn.classList.add('visible');
    waitingForNext = true;
  }
}

function stopRinging() {
  if (ringIntervalId) {
    clearInterval(ringIntervalId);
    ringIntervalId = null;
  }
  nextBtn.classList.remove('visible');
  waitingForNext = false;
}

function switchMode() {
  stopRinging();
  startRinging();
  if (!manualMode) {
    setTimeout(() => doSwitch(), 2000);
  }
}

function doSwitch() {
  stopRinging();
  currentIndex = (currentIndex + 1) % intervals.length;
  if (currentIndex === 0) cycle++;
  timeLeft = intervals[currentIndex];
  totalTime = intervals[currentIndex];
  modeEl.textContent = labels[currentIndex];
  container.classList.toggle('work', currentIndex === 0);
  container.classList.toggle('rest', currentIndex === 1);
  cycleEl.textContent = `Цикл: ${cycle}`;
  container.classList.add('pulse');
  setTimeout(() => container.classList.remove('pulse'), 600);
  updateDisplay();
}

function tick() {
  if (waitingForNext) return;
  if (timeLeft > 0) {
    timeLeft--;
    updateDisplay();
  } else {
    switchMode();
  }
}

startBtn.addEventListener('click', () => {
  if (audioContext.state === 'suspended') audioContext.resume();
  if (isRunning) {
    clearInterval(timerId);
    isRunning = false;
    startBtn.textContent = 'Старт';
  } else {
    timerId = setInterval(tick, 1000);
    isRunning = true;
    startBtn.textContent = 'Пауза';
  }
});

resetBtn.addEventListener('click', () => {
  clearInterval(timerId);
  stopRinging();
  isRunning = false;
  currentIndex = 0;
  cycle = 1;
  timeLeft = intervals[0];
  totalTime = intervals[0];
  modeEl.textContent = labels[0];
  container.classList.remove('rest');
  container.classList.add('work');
  cycleEl.textContent = 'Цикл: 1';
  startBtn.textContent = 'Старт';
  updateDisplay();
});

nextBtn.addEventListener('click', () => {
  if (audioContext.state === 'suspended') audioContext.resume();
  doSwitch();
});

// ====== ИНТЕРВАЛЫ ======
function updateIntervals() {
  const w = Math.max(5, Math.min(3600, parseInt(workInput.value) || 60));
  const r = Math.max(5, Math.min(3600, parseInt(restInput.value) || 30));
  workInput.value = w;
  restInput.value = r;
  intervals = [w, r];
  localStorage.setItem('timer_work', w);
  localStorage.setItem('timer_rest', r);
  if (!isRunning) {
    timeLeft = intervals[currentIndex];
    totalTime = intervals[currentIndex];
    updateDisplay();
  }
}

workInput.addEventListener('change', updateIntervals);
restInput.addEventListener('change', updateIntervals);

manualCheckbox.addEventListener('change', () => {
  manualMode = manualCheckbox.checked;
  localStorage.setItem('timer_manual', manualMode);
});

settingsToggle.addEventListener('click', () => {
  settingsPanel.classList.toggle('open');
});

// ====== МЕЛОДИИ ======
const melodyGrid = document.getElementById('melodyGrid');
melodies.forEach((m, i) => {
  const btn = document.createElement('button');
  btn.className = 'melody-btn' + (i === 0 ? ' active' : '');
  btn.textContent = m.name;
  btn.dataset.melody = i;
  btn.addEventListener('click', () => {
    if (audioContext.state === 'suspended') audioContext.resume();
    document.querySelectorAll('.melody-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentMelody = i;
    localStorage.setItem('timer_melody', i);
    playMelody(currentMelody);
  });
  melodyGrid.appendChild(btn);
});

// ====== ТЕМЫ ======
const themeGrid = document.getElementById('themeGrid');
Object.keys(themes).forEach(name => {
  const btn = document.createElement('div');
  btn.className = `theme-btn theme-${name}` + (name === 'cosmic' ? ' active' : '');
  btn.dataset.theme = name;
  btn.title = name;
  btn.addEventListener('click', () => applyTheme(name));
  themeGrid.appendChild(btn);
});

// ====== ПЛЕЙЛИСТ ======
let playlist = [];
let currentTrackIndex = -1;

function renderPlaylist() {
  modalPlaylist.innerHTML = '';
  
  if (playlist.length === 0) {
    modalPlaylist.innerHTML = '<div style="color:rgba(255,255,255,0.4);text-align:center;padding:40px 20px;font-family:Rajdhani;font-size:1.1rem;"> Плейлист пуст<br><small style="opacity:0.6">Добавьте треки выше</small></div>';
    return;
  }
  
  playlist.forEach((track, i) => {
    const item = document.createElement('div');
    item.className = 'playlist-item' + (i === currentTrackIndex ? ' active' : '');
    
    const name = document.createElement('div');
    name.className = 'playlist-item-name';
    name.textContent = track.name;
    name.title = track.name;
    
    const playBtn = document.createElement('button');
    playBtn.className = 'playlist-item-btn' + (i === currentTrackIndex && !bgAudio.paused ? ' playing' : '');
    playBtn.textContent = i === currentTrackIndex && !bgAudio.paused ? '⏸' : '▶';
    playBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (i === currentTrackIndex && !bgAudio.paused) {
        bgAudio.pause();
      } else {
        playTrack(i);
      }
      renderPlaylist();
    });
    
    const deleteBtn = document.createElement('button');
    deleteBtn.className = 'playlist-item-btn delete';
    deleteBtn.textContent = '✕';
    deleteBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      deleteTrack(i);
    });
    
    item.appendChild(name);
    item.appendChild(playBtn);
    item.appendChild(deleteBtn);
    modalPlaylist.appendChild(item);
  });
}

function playTrack(index) {
  if (index < 0 || index >= playlist.length) return;
  
  const track = playlist[index];
  currentTrackIndex = index;
  
  bgAudio.src = track.data;
  bgAudio.volume = (modalVolumeSlider.value || volumeSlider.value) / 100;
  
  bgAudio.play().then(() => {
    console.log('Playing:', track.name);
    renderPlaylist();
  }).catch(err => {
    console.error('Playback error:', err);
    alert('Ошибка воспроизведения: ' + err.message);
  });
}

function deleteTrack(index) {
  if (index < 0 || index >= playlist.length) return;
  
  const wasPlaying = (index === currentTrackIndex);
  
  playlist.splice(index, 1);
  
  if (wasPlaying) {
    bgAudio.pause();
    bgAudio.src = '';
    currentTrackIndex = -1;
  } else if (currentTrackIndex > index) {
    currentTrackIndex--;
  }
  
  Storage.savePlaylist(playlist);
  renderPlaylist();
}

bgAudio.addEventListener('ended', () => {
  if (playlist.length > 0) {
    const nextIndex = (currentTrackIndex + 1) % playlist.length;
    playTrack(nextIndex);
  }
});

// Открытие модального окна
playlistToggle.addEventListener('click', () => {
  modalOverlay.classList.add('visible');
  renderPlaylist();
});

// Закрытие модального окна
modalClose.addEventListener('click', () => {
  modalOverlay.classList.remove('visible');
});

modalOverlay.addEventListener('click', (e) => {
  if (e.target === modalOverlay) {
    modalOverlay.classList.remove('visible');
  }
});

// Добавление музыки
modalMusicInput.addEventListener('change', (e) => {
  const files = Array.from(e.target.files);
  console.log('Files selected:', files);
  
  if (files.length === 0) {
    console.log('No files selected');
    return;
  }
  
  let loadedCount = 0;
  
  files.forEach(file => {
    const reader = new FileReader();
    
    reader.onload = function(event) {
      const dataUrl = event.target.result;
      const track = {
        id: Date.now() + Math.random(),
        name: file.name,
        data: dataUrl,
        type: file.type
      };
      
      playlist.push(track);
      loadedCount++;
      
      console.log('Loaded track:', track.name);
      
      if (loadedCount === files.length) {
        Storage.savePlaylist(playlist);
        renderPlaylist();
        
        if (currentTrackIndex === -1 && playlist.length > 0) {
          playTrack(0);
        }
        
        modalMusicInput.value = '';
      }
    };
    
    reader.onerror = function() {
      console.error('Error reading file:', file.name);
      alert('Ошибка чтения файла: ' + file.name);
    };
    
    reader.readAsDataURL(file);
  });
});

// Синхронизация громкости
volumeSlider.addEventListener('input', () => {
  bgAudio.volume = volumeSlider.value / 100;
  modalVolumeSlider.value = volumeSlider.value;
  localStorage.setItem('timer_volume', volumeSlider.value);
});

modalVolumeSlider.addEventListener('input', () => {
  bgAudio.volume = modalVolumeSlider.value / 100;
  volumeSlider.value = modalVolumeSlider.value;
  localStorage.setItem('timer_volume', modalVolumeSlider.value);
});

// ====== ФОН ======
bgInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  
  const reader = new FileReader();
  
  reader.onload = function(event) {
    const dataUrl = event.target.result;
    const isVideo = file.type.startsWith('video/');
    
    if (isVideo) {
      bgVideo.src = dataUrl;
      bgVideo.style.display = 'block';
      bgImage.style.display = 'none';
      bgVideo.play();
      bgPreview.innerHTML = `<video src="${dataUrl}" autoplay muted loop></video>`;
    } else {
      bgImage.src = dataUrl;
      bgImage.style.display = 'block';
      bgVideo.style.display = 'none';
      bgPreview.innerHTML = `<img src="${dataUrl}">`;
    }
    
    bgPreview.classList.add('visible');
    Storage.saveBgMedia(file.type, dataUrl);
    bgInput.value = '';
  };
  
  reader.onerror = function() {
    alert('Ошибка чтения файла');
  };
  
  reader.readAsDataURL(file);
});

// Удаление фона
removeBgBtn.addEventListener('click', () => {
  bgVideo.style.display = 'none';
  bgImage.style.display = 'none';
  bgVideo.src = '';
  bgImage.src = '';
  bgPreview.classList.remove('visible');
  bgPreview.innerHTML = '';
  Storage.deleteBgMedia();
});

// ====== ЗАГРУЗКА СОХРАНЁННЫХ НАСТРОЕК ======
function loadSavedSettings() {
  const savedTheme = localStorage.getItem('timer_theme');
  const savedWork = localStorage.getItem('timer_work');
  const savedRest = localStorage.getItem('timer_rest');
  const savedMelody = localStorage.getItem('timer_melody');
  const savedManual = localStorage.getItem('timer_manual');
  const savedVolume = localStorage.getItem('timer_volume');
  
  if (savedTheme && themes[savedTheme]) applyTheme(savedTheme);
  if (savedWork) { workInput.value = savedWork; intervals[0] = parseInt(savedWork); }
  if (savedRest) { restInput.value = savedRest; intervals[1] = parseInt(savedRest); }
  if (savedMelody !== null) {
    currentMelody = parseInt(savedMelody);
    document.querySelectorAll('.melody-btn').forEach((b, i) => {
      b.classList.toggle('active', i === currentMelody);
    });
  }
  if (savedManual === 'true') {
    manualMode = true;
    manualCheckbox.checked = true;
  }
  if (savedVolume) {
    volumeSlider.value = savedVolume;
    modalVolumeSlider.value = savedVolume;
    bgAudio.volume = savedVolume / 100;
  }
  
  timeLeft = intervals[currentIndex];
  totalTime = intervals[currentIndex];
}

function loadSavedData() {
  // Загрузка плейлиста
  playlist = Storage.getPlaylist();
  console.log('Loaded playlist:', playlist);
  renderPlaylist();
  
  // Загрузка фона
  const bg = Storage.getBgMedia();
  if (bg && bg.data) {
    if (bg.type.startsWith('video/')) {
      bgVideo.src = bg.data;
      bgVideo.style.display = 'block';
      bgVideo.play();
      bgPreview.innerHTML = `<video src="${bg.data}" autoplay muted loop></video>`;
    } else if (bg.type.startsWith('image/')) {
      bgImage.src = bg.data;
      bgImage.style.display = 'block';
      bgPreview.innerHTML = `<img src="${bg.data}">`;
    }
    bgPreview.classList.add('visible');
  }
}

// ====== ИНИЦИАЛИЗАЦИЯ ======
loadSavedSettings();
loadSavedData();
updateDisplay();
</script>

</body>
</html>
